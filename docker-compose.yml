# Local:  docker compose up --build          -> http://localhost:8000
# AWS  :  DOMAIN=<elastic-ip-with-dashes>.sslip.io docker compose --profile https up -d --build
services:
  app:
    build: .
    env_file: server/.env.local
    environment:
      PORT: "8000"
    volumes:
      - arogya-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Automatic HTTPS (Let's Encrypt) in front of the app. Agora cloud needs a public https URL for /llm.
  caddy:
    image: caddy:2
    profiles: ["https"]
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. 13-233-10-5.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  arogya-data:
  caddy-data:
  caddy-config:
